# Render Blueprint: one free web service serves the static client AND the WebSocket game server.
services:
  - type: web
    name: cheese-chase
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
